<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
</head>
<body>
<h1>Calculadora</h1>

<form action="/calcular" method="post">
  <p>
    <label for="titulo">Título</label><br>
    <select id="titulo" name="titulo" required>
      <option value="">Selecione</option>
      <option value="Mestre">Mestre</option>
      <option value="Doutor">Doutor</option>
      <option value="Pós-Doutor">Pós-Doutor</option>
    </select>
  </p>

  <p>
    <label for="salBrutoMensal">Salário bruto mensal (R$)</label><br>
    <input type="number" id="salBrutoMensal" name="salBrutoMensal" min="0" step="0.01" value="0" required>
  </p>

  <p>
    <label for="pesquisadores">Número de pesquisadores</label><br>
    <input type="number" id="pesquisadores" name="pesquisadores" min="1" step="1" value="1" required>
  </p>

  <p>
    <label for="regime">Regime tributário</label><br>
    <select id="regime" name="regime" required>
      <option value="Lucro real" selected>Lucro real</option>
      <option value="Lucro presumido">Lucro presumido</option>
      <option value="Simples Nacional">Simples Nacional</option>
    </select>
  </p>

  <p>
    <label for="aliquota">Alíquota (%)</label><br>
    <input type="number" id="aliquota" name="aliquota" min="0" max="100" step="0.01" value="0" required>
  </p>

  <fieldset>
    <legend>Alocação exclusiva?</legend>
    <label><input type="radio" name="alocacaoExclusiva" value="True" checked required> Sim</label>
    <label><input type="radio" name="alocacaoExclusiva" value="False"> Não</label>
  </fieldset>

  <fieldset>
    <legend>Há incremento?</legend>
    <label><input type="radio" name="incremento" value="True" checked required> Sim</label>
    <label><input type="radio" name="incremento" value="False"> Não</label>
  </fieldset>

  <fieldset>
    <legend>Possui patente?</legend>
    <label><input type="radio" name="havePatente" value="True" required> Sim</label>
    <label><input type="radio" name="havePatente" value="False" checked> Não</label>
  </fieldset>

  <fieldset>
    <legend>Utiliza programa de cofinanciamento?</legend>
    <label><input type="radio" name="cofinanciamento" value="True" required> Sim</label>
    <label><input type="radio" name="cofinanciamento" value="False" checked> Não</label>
  </fieldset>

  <p>
    <label for="subvencao">Subvenção (%) — 0 a 50, obrigatório se houver cofinanciamento</label><br>
    <input type="number" id="subvencao" name="subvencao" min="0" max="50" step="0.01" value="0">
  </p>

  <p>
    <label for="periodo">Período (meses) — 0 a 12, obrigatório se houver cofinanciamento</label><br>
    <input type="number" id="periodo" name="periodo" min="0" max="12" step="1" value="0">
  </p>

  <p>
    <button type="submit">Calcular</button>
  </p>
</form>

<script>
  // subvencao e periodo só são obrigatórios quando cofinanciamento = True
  var radiosCofin = document.querySelectorAll('input[name="cofinanciamento"]');
  function atualizarObrigatorios() {
    var ativo = document.querySelector('input[name="cofinanciamento"]:checked').value === "True";
    document.getElementById("subvencao").required = ativo;
    document.getElementById("periodo").required = ativo;
  }
  radiosCofin.forEach(function (r) { r.addEventListener("change", atualizarObrigatorios); });
  atualizarObrigatorios();
</script>
</body>
</html>
